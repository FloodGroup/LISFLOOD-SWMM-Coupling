<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif">
  <defs>
    <linearGradient id="soil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EEE8DD"/><stop offset="1" stop-color="#E2D8C6"/>
    </linearGradient>
    <linearGradient id="rw" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A3C0DA"/><stop offset="1" stop-color="#3F6F9A"/>
    </linearGradient>
    <linearGradient id="pw" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9CC3B3"/><stop offset="1" stop-color="#4C8775"/>
    </linearGradient>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="10" height="10" fill="none"/>
      <line x1="0" y1="0" x2="0" y2="10" stroke="#2A5E51" stroke-width="2.5" stroke-opacity="0.3"/>
    </pattern>
    <marker id="o" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4643A"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4D4D4D"/></marker>
    <clipPath id="pc"><rect x="31" y="31" width="738" height="638" rx="9"/></clipPath>
  </defs>

  <rect width="1200" height="700" fill="#ffffff"/>

  <!-- ============ profile panel ============ -->
  <rect x="30.5" y="30.5" width="739" height="639" rx="10" fill="#ffffff" stroke="#D4D4D4"/>
  <g clip-path="url(#pc)">
    <path d="M30,170 H580 L600,450 H770 V670 H30 Z" fill="url(#soil)"/>
    <rect x="30" y="167" width="550" height="6" fill="#5A5A5A"/>
    <path d="M590,310 H770 V450 H600 Z" fill="url(#rw)"/>
    <path d="M590,310 Q630,304 670,310 T750,310 T790,310" fill="none" stroke="#DCE7F1" stroke-width="2"/>

    <!-- terminal conduit -->
    <path d="M160,360 L600,402 L600,436 L160,394 Z" fill="#F4F4F2"/>
    <path d="M160,374 L600,416 L600,436 L160,394 Z" fill="url(#pw)"/>
    <path d="M160,360 L600,402 L600,436 L160,394 Z" fill="url(#hatch)" stroke="#4D4D4D" stroke-width="2.5" stroke-linejoin="round"/>

    <!-- interior junction -->
    <rect x="118" y="170" width="44" height="226" fill="#F4F4F2" stroke="#4D4D4D" stroke-width="2.5"/>
    <rect x="120" y="310" width="40" height="84" fill="url(#pw)"/>
    <rect x="110" y="164" width="60" height="7" rx="2" fill="#333333"/>
    <circle cx="140" cy="382" r="7" fill="#ffffff" stroke="#2A5E51" stroke-width="3"/>

    <!-- receiving cell -->
    <rect x="634" y="250" width="100" height="200" fill="none" stroke="#B4643A" stroke-width="2" stroke-dasharray="7 5"/>
    <line x1="752" y1="314" x2="752" y2="446" stroke="#4D4D4D" stroke-width="1.5" marker-start="url(#g)" marker-end="url(#g)"/>

    <!-- outfall face + exchange -->
    <line x1="600" y1="396" x2="600" y2="442" stroke="#B4643A" stroke-width="5" stroke-linecap="round"/>
    <path d="M612,412 H660" stroke="#B4643A" stroke-width="3.5" fill="none" marker-end="url(#o)"/>
    <path d="M660,428 H612" stroke="#B4643A" stroke-width="3.5" fill="none" marker-end="url(#o)"/>
  </g>

  <text x="54" y="68" font-size="19" font-weight="700" fill="#222222">COUPLED outfall as an exchange face</text>
  <text x="54" y="94" font-size="15" fill="#666666">longitudinal section through the last conduit and the 2-D receiving cell</text>

  <g font-size="16" fill="#222222">
    <text x="140" y="150" text-anchor="middle" font-weight="700" fill="#2A5E51">interior node</text>
    <text x="684" y="240" text-anchor="middle" font-weight="700" fill="#8A4521">receiving 2-D cell</text>
    <text x="684" y="220" text-anchor="middle" font-size="14.5" fill="#666666">plan area A</text>
    <text x="700" y="303" font-weight="700" fill="#2C5577">H</text>
    <text x="640" y="442" font-weight="700" fill="#ffffff">z<tspan baseline-shift="sub" font-size="11">bed</tspan></text>
    <text x="740" y="385" font-weight="700" fill="#ffffff" text-anchor="end">h</text>
  </g>

  <!-- callouts -->
  <g font-size="14">
    <line x1="400" y1="408" x2="400" y2="536" stroke="#3F7F6E" stroke-width="1.5"/>
    <circle cx="400" cy="408" r="3.5" fill="#3F7F6E"/>
    <rect x="292" y="536" width="262" height="66" rx="8" fill="#EBF3EF"/>
    <text x="306" y="562" font-size="15" font-weight="700" fill="#2A5E51">conduit storage &#8594; interior node</text>
    <text x="306" y="586" fill="#555555" font-size="14.5">end-volume weight 1 (hatched)</text>

    <line x1="600" y1="446" x2="600" y2="536" stroke="#B4643A" stroke-width="1.5"/>
    <rect x="566" y="536" width="190" height="66" rx="8" fill="#F7EEE7"/>
    <text x="580" y="562" font-size="15" font-weight="700" fill="#8A4521">outfall face, weight 0</text>
    <text x="580" y="586" fill="#555555" font-size="14.5">no fictitious half-pipe</text>
  </g>

  <!-- inset: interior-interior split -->
  <rect x="48" y="524" width="230" height="78" rx="8" fill="#F6F6F4"/>
  <line x1="74" y1="562" x2="252" y2="562" stroke="#4D4D4D" stroke-width="10" stroke-linecap="round" stroke-opacity="0.22"/>
  <circle cx="74" cy="562" r="7" fill="#ffffff" stroke="#2A5E51" stroke-width="3"/>
  <circle cx="252" cy="562" r="7" fill="#ffffff" stroke="#2A5E51" stroke-width="3"/>
  <line x1="163" y1="549" x2="163" y2="575" stroke="#4D4D4D" stroke-width="1.5" stroke-dasharray="3 2"/>
  <g font-size="15" fill="#555555" text-anchor="middle">
    <text x="118" y="548">&#189;</text><text x="208" y="548">&#189;</text>
    <text x="163" y="594" font-size="13.5">interior&#8211;interior conduit</text>
  </g>

  <!-- ============ equations panel ============ -->
  <rect x="790.5" y="30.5" width="379" height="639" rx="10" fill="#ffffff" stroke="#D4D4D4"/>
  <text x="810" y="68" font-size="19" font-weight="700" fill="#222222">Volume bookkeeping</text>
  <text x="810" y="94" font-size="14.5" fill="#666666">SWMM side, shared by CPU and GPU builds</text>

  <g font-size="12.5" fill="#8A8A8A">
    <rect x="806" y="112" width="348" height="98" rx="8" fill="#EEF3F8"/>
    <text x="822" y="138" font-size="15" font-weight="700" fill="#2C5577">1  Receiving-cell stage</text>
    <text x="822" y="170" font-size="19" fill="#222222" font-weight="700">H<tspan baseline-shift="sub" font-size="12.5">ext</tspan> = z<tspan baseline-shift="sub" font-size="12.5">bed</tspan> + V<tspan baseline-shift="sub" font-size="12.5">cell</tspan> / A</text>
    <text x="822" y="197" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">coupled_set_cell</text>

    <rect x="806" y="218" width="348" height="98" rx="8" fill="#EEF3F8"/>
    <text x="822" y="244" font-size="15" font-weight="700" fill="#2C5577">2  Cell water volume</text>
    <text x="822" y="276" font-size="19" fill="#222222" font-weight="700">V<tspan baseline-shift="sub" font-size="12.5">cell</tspan> = A &#183; max(0, H &#8722; z<tspan baseline-shift="sub" font-size="12.5">bed</tspan>)</text>
    <text x="822" y="303" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">cell_volume</text>

    <rect x="806" y="324" width="348" height="98" rx="8" fill="#ECF4F0"/>
    <text x="822" y="350" font-size="15" font-weight="700" fill="#2A5E51">3  Node continuity (backward Euler)</text>
    <text x="822" y="382" font-size="19" fill="#222222" font-weight="700">V<tspan baseline-shift="super" font-size="12.5">n+1</tspan> = V<tspan baseline-shift="super" font-size="12.5">n</tspan> + &#948;t (Q<tspan baseline-shift="sub" font-size="12.5">in</tspan> &#8722; Q<tspan baseline-shift="sub" font-size="12.5">out</tspan>)</text>
    <text x="822" y="409" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">coupled_solve_node &#183; _cells</text>

    <rect x="806" y="430" width="348" height="98" rx="8" fill="#F7EFE9"/>
    <text x="822" y="456" font-size="15" font-weight="700" fill="#8A4521">4  Exchange credited at the face</text>
    <text x="822" y="488" font-size="19" fill="#222222" font-weight="700">&#916;V<tspan baseline-shift="sub" font-size="12.5">ex</tspan> = Q<tspan baseline-shift="sub" font-size="12.5">net</tspan> &#948;t <tspan font-weight="400" font-size="14.5" fill="#666666">(&#916;V<tspan baseline-shift="sub" font-size="10.5">end</tspan> = 0 at the face)</tspan></text>
    <text x="822" y="515" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">coupled_commit</text>

    <rect x="806" y="536" width="348" height="98" rx="8" fill="#F6F6F4"/>
    <text x="822" y="562" font-size="15" font-weight="700" fill="#444444">5  Finite-supply limit, per donor</text>
    <text x="822" y="594" font-size="19" fill="#222222" font-weight="700">&#931; Q<tspan baseline-shift="sub" font-size="12.5">out</tspan> &#8804; V<tspan baseline-shift="super" font-size="12.5">n</tspan> / &#948;t + &#931; Q<tspan baseline-shift="sub" font-size="12.5">in</tspan></text>
    <text x="822" y="621" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">coupled_limit_flows</text>
  </g>
  <text x="810" y="656" font-size="13" fill="#777777">ft&#179; inside SWMM, m&#179; at the coupling API (methodology &#167;9)</text>
</svg>