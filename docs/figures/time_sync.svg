<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif">
  <defs>
    <pattern id="hO" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#F7EEE7"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#B4643A" stroke-width="2" stroke-opacity="0.55"/>
    </pattern>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F2DCCB"/><stop offset="1" stop-color="#B4643A"/>
    </linearGradient>
    <marker id="gm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3F7F6E"/></marker>
    <marker id="bm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3F6F9A"/></marker>
    <marker id="k" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4D4D4D"/></marker>
  </defs>

  <rect width="1200" height="570" fill="#ffffff"/>

  <text x="30" y="42" font-size="19" font-weight="700" fill="#222222">coupleint T  (CUDA ACC / FV1)</text>
  <text x="30" y="66" font-size="15" fill="#666666">2-D steps accumulate inlet volume; SWMM advances once per interval and returns the integrated exchange</text>

  <!-- interval boundaries -->
  <g stroke="#A8A8A8" stroke-width="1.5" stroke-dasharray="5 4">
    <line x1="130" y1="100" x2="130" y2="396"/>
    <line x1="530" y1="100" x2="530" y2="396"/>
    <line x1="930" y1="100" x2="930" y2="396"/>
  </g>

  <!-- row labels -->
  <g font-size="15" font-weight="700" fill="#333333" text-anchor="end">
    <text x="118" y="170">2-D dt</text>
    <text x="118" y="230">volume V</text>
    <text x="118" y="361">SWMM &#948;t</text>
  </g>

  <!-- row A: 2-D steps -->
  <g stroke="#7FA3C4" stroke-width="1.3" fill="#E6EDF4">
    <rect x="132" y="144" width="74" height="40" rx="5"/>
    <rect x="210" y="144" width="88" height="40" rx="5"/>
    <rect x="302" y="144" width="62" height="40" rx="5"/>
    <rect x="368" y="144" width="100" height="40" rx="5"/>
    <rect x="532" y="144" width="84" height="40" rx="5"/>
    <rect x="620" y="144" width="68" height="40" rx="5"/>
    <rect x="692" y="144" width="92" height="40" rx="5"/>
    <rect x="788" y="144" width="80" height="40" rx="5"/>
    <rect x="932" y="144" width="76" height="40" rx="5"/>
    <rect x="1012" y="144" width="66" height="40" rx="5"/>
  </g>
  <g stroke="#B4643A" stroke-width="1.5">
    <rect x="472" y="144" width="56" height="40" rx="5" fill="url(#hO)"/>
    <rect x="872" y="144" width="56" height="40" rx="5" fill="url(#hO)"/>
  </g>
  <g font-size="15" fill="#2C5577" text-anchor="middle" font-style="italic">
    <text x="169" y="169">dt</text><text x="254" y="169">dt</text><text x="333" y="169">dt</text><text x="418" y="169">dt</text>
    <text x="574" y="169">dt</text><text x="654" y="169">dt</text><text x="738" y="169">dt</text><text x="828" y="169">dt</text>
    <text x="970" y="169">dt</text><text x="1045" y="169">dt</text>
  </g>
  <text x="1112" y="170" font-size="20" fill="#9A9A9A" text-anchor="middle">&#8230;</text>

  <!-- clipped-step callout -->
  <path d="M500,140 C500,120 474,112 446,112" stroke="#B4643A" stroke-width="1.5" fill="none"/>
  <text x="440" y="111" font-size="14.5" fill="#8A4521" text-anchor="end" font-weight="700">last dt clipped to land on the boundary</text>
  <text x="440" y="130" font-size="13" fill="#666666" text-anchor="end" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">swmm_couple_clip_dt</text>

  <!-- row B: accumulation wedges -->
  <path d="M132,236 L528,210 L528,236 Z" fill="url(#acc)"/>
  <path d="M532,236 L928,210 L928,236 Z" fill="url(#acc)"/>
  <path d="M932,236 L1080,226 L1080,236 Z" fill="url(#acc)" opacity="0.7"/>
  <text x="146" y="226" font-size="15" fill="#8A4521" font-weight="700">V<tspan baseline-shift="sub" font-size="11">i</tspan> = &#931; Q<tspan baseline-shift="sub" font-size="11">i</tspan> dt</text>
  <text x="562" y="226" font-size="15" fill="#8A4521" font-weight="700">reset after exchange</text>

  <!-- hand-over arrows at boundaries -->
  <g stroke-width="2.5" fill="none">
    <path d="M516,244 V330" stroke="#3F7F6E" marker-end="url(#gm)"/>
    <path d="M544,330 V192" stroke="#3F6F9A" marker-end="url(#bm)"/>
    <path d="M916,244 V330" stroke="#3F7F6E" marker-end="url(#gm)"/>
    <path d="M944,330 V192" stroke="#3F6F9A" marker-end="url(#bm)"/>
  </g>
  <g font-size="14.5" font-weight="700">
    <rect x="370" y="262" width="136" height="44" rx="6" fill="#EBF3EF"/>
    <text x="438" y="280" text-anchor="middle" fill="#2A5E51">Node_Inflow</text>
    <text x="438" y="298" text-anchor="middle" fill="#2A5E51">= V / T</text>
    <rect x="554" y="262" width="186" height="44" rx="6" fill="#EDF2F7"/>
    <text x="647" y="280" text-anchor="middle" fill="#2C5577">outfall &#916;V + flooding</text>
    <text x="647" y="298" text-anchor="middle" fill="#2C5577">&#8594; 2-D point sources</text>
  </g>

  <!-- row C: SWMM sub-steps -->
  <g fill="#E3EEE9" stroke="#6FA291" stroke-width="1">
    <rect x="132" y="342" width="38" height="30" rx="4"/><rect x="172" y="342" width="33" height="30" rx="4"/><rect x="207" y="342" width="43" height="30" rx="4"/><rect x="252" y="342" width="28" height="30" rx="4"/><rect x="282" y="342" width="48" height="30" rx="4"/>
    <rect x="332" y="342" width="38" height="30" rx="4"/><rect x="372" y="342" width="33" height="30" rx="4"/><rect x="407" y="342" width="43" height="30" rx="4"/><rect x="452" y="342" width="38" height="30" rx="4"/><rect x="492" y="342" width="36" height="30" rx="4"/>
    <rect x="532" y="342" width="43" height="30" rx="4"/><rect x="577" y="342" width="38" height="30" rx="4"/><rect x="617" y="342" width="33" height="30" rx="4"/><rect x="652" y="342" width="48" height="30" rx="4"/><rect x="702" y="342" width="28" height="30" rx="4"/>
    <rect x="732" y="342" width="43" height="30" rx="4"/><rect x="777" y="342" width="38" height="30" rx="4"/><rect x="817" y="342" width="33" height="30" rx="4"/><rect x="852" y="342" width="38" height="30" rx="4"/><rect x="892" y="342" width="36" height="30" rx="4"/>
    <rect x="932" y="342" width="38" height="30" rx="4" opacity="0.6"/><rect x="972" y="342" width="33" height="30" rx="4" opacity="0.6"/><rect x="1007" y="342" width="43" height="30" rx="4" opacity="0.6"/>
  </g>
  <text x="1112" y="362" font-size="20" fill="#9A9A9A" text-anchor="middle">&#8230;</text>
  <text x="330" y="391" font-size="13" fill="#2A5E51" text-anchor="middle" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">swmm_advanceCoupled(T), run at t0 + T</text>
  <text x="730" y="391" font-size="13" fill="#2A5E51" text-anchor="middle" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">swmm_advanceCoupled(T), run at t0 + 2T</text>

  <!-- time axis -->
  <line x1="130" y1="410" x2="1160" y2="410" stroke="#4D4D4D" stroke-width="1.8" marker-end="url(#k)"/>
  <g font-size="15" fill="#333333" text-anchor="middle" font-weight="700">
    <text x="130" y="432">t0</text><text x="530" y="432">t0 + T</text><text x="930" y="432">t0 + 2T</text>
    <text x="1168" y="415" text-anchor="start">t</text>
  </g>

  <!-- step mode -->
  <line x1="30" y1="458" x2="1170" y2="458" stroke="#E0E0E0"/>
  <text x="30" y="490" font-size="17" font-weight="700" fill="#222222">coupleint step</text>
  <text x="30" y="512" font-size="14.5" fill="#666666">one exchange per</text>
  <text x="30" y="531" font-size="14.5" fill="#666666">2-D step, T = dt</text>
  <g stroke="#7FA3C4" stroke-width="1.3" fill="#E6EDF4">
    <rect x="232" y="486" width="74" height="36" rx="5"/>
    <rect x="320" y="486" width="88" height="36" rx="5"/>
    <rect x="422" y="486" width="62" height="36" rx="5"/>
    <rect x="498" y="486" width="100" height="36" rx="5"/>
    <rect x="612" y="486" width="84" height="36" rx="5"/>
    <rect x="710" y="486" width="68" height="36" rx="5"/>
    <rect x="792" y="486" width="92" height="36" rx="5"/>
  </g>
  <g fill="#B4643A">
    <circle cx="313" cy="504" r="5"/><circle cx="415" cy="504" r="5"/><circle cx="491" cy="504" r="5"/><circle cx="605" cy="504" r="5"/><circle cx="703" cy="504" r="5"/><circle cx="785" cy="504" r="5"/><circle cx="891" cy="504" r="5"/>
  </g>
  <text x="912" y="500" font-size="14.5" fill="#8A4521" font-weight="700">exchange after every step</text>
  <text x="912" y="519" font-size="14" fill="#666666">simplest and most tightly coupled</text>
</svg>
